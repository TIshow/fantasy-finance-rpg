# ローカル開発用のPostgreSQL（本番はSupabase東京。D-027）。
# 起動: docker compose up -d  /  停止: docker compose down
# kabu-leagueのDB（5432）とぶつからないよう、ホスト側は5433番を使う。
services:
  db:
    image: postgres:17-alpine
    container_name: guild-market-db
    environment:
      POSTGRES_USER: gm
      POSTGRES_PASSWORD: gm
      POSTGRES_DB: guild_market
    ports:
      - "5433:5432"
    volumes:
      - gm_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gm -d guild_market"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gm_pgdata:
