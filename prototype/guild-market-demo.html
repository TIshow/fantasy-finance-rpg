<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="F-Sports #01 GUILD MARKET 銀行提案用オフラインプロトタイプ">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>F-Sports #01 GUILD MARKET</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-deep: #040a12;
      --panel: #0e2033;
      --panel-soft: #132a42;
      --panel-light: #1a3652;
      --border: rgba(186, 209, 230, 0.16);
      --border-strong: rgba(243, 201, 105, 0.42);
      --text: #f7f2e8;
      --muted: #a7b7c8;
      --muted-strong: #c8d4df;
      --gold: #f3c969;
      --gold-deep: #c99b3d;
      --buy: #43d59a;
      --sell: #ff7676;
      --info: #68b6ff;
      --warning: #ffb15c;
      --airship: #62c8ff;
      --alchemy: #bb91ff;
      --dragon: #ff934f;
      --academy: #70d49a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --content: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-deep);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.55;
      background:
        radial-gradient(circle at 14% 0%, rgba(61, 137, 194, 0.24), transparent 34rem),
        radial-gradient(circle at 92% 10%, rgba(243, 201, 105, 0.12), transparent 28rem),
        linear-gradient(160deg, var(--bg) 0%, #081725 52%, var(--bg-deep) 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid rgba(104, 182, 255, 0.85);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 100;
      padding: 10px 14px;
      color: #06111e;
      background: var(--gold);
      border-radius: 10px;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .app-shell {
      min-height: 100vh;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 14, 24, 0.88);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      width: min(calc(100% - 32px), var(--content));
      min-height: 74px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      color: #091522;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(145deg, #ffe6a2, var(--gold-deep));
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 13px 13px 18px 18px;
      box-shadow: 0 8px 24px rgba(243, 201, 105, 0.2);
      transform: rotate(3deg);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-kicker {
      display: block;
      margin-bottom: 1px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .brand-title {
      display: block;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 2vw, 21px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .demo-badge,
    .market-badge,
    .ticket-badge {
      display: inline-flex;
      min-height: 34px;
      gap: 7px;
      align-items: center;
      padding: 7px 11px;
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .market-badge[data-open="true"] {
      color: #b8f7dc;
      background: rgba(67, 213, 154, 0.1);
      border-color: rgba(67, 213, 154, 0.32);
    }

    .market-badge[data-open="false"] {
      color: #ffd4d4;
      background: rgba(255, 118, 118, 0.08);
      border-color: rgba(255, 118, 118, 0.24);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .ghost-button {
      min-height: 38px;
      padding: 7px 12px;
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 700;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
    }

    .ghost-button:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .progress-wrap {
      width: min(calc(100% - 32px), var(--content));
      margin: 0 auto;
      padding: 0 0 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .progress-track {
      overflow: hidden;
      height: 4px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
    }

    .progress-value {
      height: 100%;
      background: linear-gradient(90deg, var(--info), var(--gold));
      border-radius: inherit;
      transition: width 320ms ease;
    }

    .asset-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(100px, 1fr));
      gap: 10px;
      width: min(calc(100% - 32px), var(--content));
      margin: 16px auto 0;
    }

    .asset-card {
      min-width: 0;
      padding: 12px 14px;
      background: rgba(11, 30, 48, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    .asset-label {
      display: block;
      margin-bottom: 1px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .asset-value {
      display: block;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 3vw, 25px);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .content {
      width: min(calc(100% - 32px), var(--content));
      margin: 18px auto 0;
    }

    .game-grid {
      display: grid;
      grid-template-areas: "market story";
      grid-template-columns: minmax(500px, 1.38fr) minmax(300px, 0.82fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      overflow: hidden;
      background: linear-gradient(155deg, rgba(19, 42, 66, 0.94), rgba(8, 25, 41, 0.96));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .story-panel {
      position: sticky;
      top: 116px;
      padding: clamp(20px, 3vw, 30px);
    }

    .market-panel {
      padding: clamp(18px, 2.5vw, 26px);
    }

    .game-grid .story-panel {
      grid-area: story;
    }

    .game-grid .market-panel {
      grid-area: market;
    }

    .eyebrow {
      display: flex;
      gap: 9px;
      align-items: center;
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .stage-title {
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 4vw, 43px);
      line-height: 1.14;
      letter-spacing: 0.015em;
    }

    .stage-copy {
      margin-bottom: 20px;
      color: var(--muted-strong);
      font-size: 15px;
    }

    .stage-note {
      margin: 18px 0;
      padding: 14px 15px;
      color: #dceafa;
      font-size: 13px;
      background: rgba(104, 182, 255, 0.08);
      border: 1px solid rgba(104, 182, 255, 0.2);
      border-radius: var(--radius-md);
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      display: inline-flex;
      min-height: 48px;
      justify-content: center;
      align-items: center;
      padding: 11px 18px;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease, border-color 150ms ease;
    }

    .primary-button {
      color: #07111f;
      background: linear-gradient(145deg, #ffe49a, var(--gold));
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 12px 28px rgba(243, 201, 105, 0.18);
    }

    .secondary-button {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
    }

    .danger-button {
      color: #ffe5e5;
      background: rgba(255, 118, 118, 0.11);
      border: 1px solid rgba(255, 118, 118, 0.32);
    }

    .primary-button:hover:not(:disabled),
    .secondary-button:hover:not(:disabled),
    .danger-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .primary-button:disabled,
    .secondary-button:disabled,
    .danger-button:disabled {
      opacity: 0.38;
      transform: none;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .requirement {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .hero {
      display: grid;
      min-height: calc(100vh - 36px);
      place-items: center;
      padding: 28px 16px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      width: min(100%, 980px);
      padding: clamp(30px, 7vw, 78px);
      text-align: center;
      background:
        radial-gradient(circle at 50% -10%, rgba(243, 201, 105, 0.24), transparent 42%),
        linear-gradient(145deg, rgba(18, 48, 74, 0.97), rgba(5, 18, 31, 0.98));
      border: 1px solid var(--border-strong);
      border-radius: 36px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.46);
    }

    .hero-card::before,
    .hero-card::after {
      position: absolute;
      width: 260px;
      height: 260px;
      pointer-events: none;
      content: "";
      border: 1px solid rgba(243, 201, 105, 0.1);
      border-radius: 50%;
    }

    .hero-card::before {
      top: -150px;
      left: -100px;
    }

    .hero-card::after {
      right: -120px;
      bottom: -170px;
    }

    .hero-mark {
      display: grid;
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      place-items: center;
      color: #0a1724;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-weight: 900;
      background: linear-gradient(145deg, #fff1bd, var(--gold-deep));
      border: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 24px 24px 34px 34px;
      box-shadow: 0 18px 46px rgba(243, 201, 105, 0.25);
      transform: rotate(3deg);
    }

    .hero-kicker {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2em;
    }

    .hero-title {
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 9vw, 84px);
      line-height: 0.98;
      letter-spacing: 0.02em;
    }

    .hero-subtitle {
      margin-bottom: 24px;
      color: var(--gold);
      font-size: clamp(17px, 3vw, 25px);
      font-weight: 800;
    }

    .hero-copy {
      max-width: 650px;
      margin: 0 auto 28px;
      color: var(--muted-strong);
      font-size: clamp(14px, 2vw, 17px);
    }

    .hero-principle {
      display: inline-flex;
      margin: 0 auto 28px;
      padding: 9px 14px;
      color: #ddecfa;
      font-size: 12px;
      font-weight: 800;
      background: rgba(104, 182, 255, 0.08);
      border: 1px solid rgba(104, 182, 255, 0.18);
      border-radius: 999px;
    }

    .hero .primary-button {
      min-width: min(100%, 280px);
      min-height: 54px;
      font-size: 16px;
    }

    .guild-briefs {
      display: grid;
      gap: 9px;
      margin: 18px 0 22px;
    }

    .guild-brief {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 11px;
      text-align: left;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .mini-seal,
    .guild-seal {
      display: grid;
      place-items: center;
      color: #06111e;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
      background: var(--guild-color);
      border: 1px solid rgba(255, 255, 255, 0.44);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--guild-color) 20%, transparent);
    }

    .mini-seal {
      width: 40px;
      height: 40px;
      border-radius: 12px 12px 16px 16px;
    }

    .guild-brief strong,
    .guild-brief small {
      display: block;
    }

    .guild-brief strong {
      font-size: 13px;
    }

    .guild-brief small {
      color: var(--muted);
      font-size: 11px;
    }

    .brief-price {
      color: var(--guild-color);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
    }

    .market-heading {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 15px;
    }

    .market-heading h2 {
      margin-bottom: 2px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 3vw, 31px);
    }

    .market-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .price-sum {
      flex: 0 0 auto;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 900;
    }

    .guild-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .guild-card {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 128px;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      align-items: start;
      padding: 15px;
      color: var(--text);
      text-align: left;
      background:
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--guild-color) 16%, transparent), transparent 55%),
        rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .guild-card:hover {
      border-color: color-mix(in srgb, var(--guild-color) 45%, var(--border));
      transform: translateY(-1px);
    }

    .guild-card[aria-pressed="true"] {
      background:
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--guild-color) 24%, transparent), transparent 60%),
        rgba(255, 255, 255, 0.07);
      border-color: var(--guild-color);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--guild-color) 34%, transparent);
    }

    .guild-card.moving {
      animation: marketPulse 520ms ease;
    }

    .guild-seal {
      width: 52px;
      height: 56px;
      border-radius: 15px 15px 21px 21px;
      font-size: 20px;
    }

    .guild-icon {
      width: 68%;
      height: 68%;
      overflow: visible;
      color: #06111e;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .winner-seal .guild-icon {
      width: 62%;
      height: 62%;
    }

    .guild-name {
      display: block;
      min-height: 38px;
      padding-right: 54px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
    }

    .guild-price {
      display: block;
      margin-top: 5px;
      color: var(--guild-color);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      line-height: 1;
    }

    .guild-trend {
      position: absolute;
      top: 15px;
      right: 14px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
    }

    .guild-trend.up {
      color: var(--buy);
    }

    .guild-trend.down {
      color: var(--sell);
    }

    .guild-trend.flat {
      color: var(--muted);
    }

    .guild-holding {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .chart-card {
      margin-top: 12px;
      padding: 14px;
      background: rgba(2, 11, 20, 0.42);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .chart-header {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .chart-title {
      margin: 0;
      font-size: 12px;
      font-weight: 900;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 10px;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 9px;
    }

    .legend-item {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      background: var(--guild-color);
      border-radius: 50%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 130px;
    }

    .trade-box {
      margin-top: 12px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .trade-empty {
      display: grid;
      min-height: 110px;
      place-items: center;
      color: var(--muted);
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.13);
      border-radius: 13px;
    }

    .trade-top {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .trade-top strong {
      display: block;
      font-size: 14px;
    }

    .trade-top small {
      color: var(--muted);
    }

    .quantity-group {
      display: flex;
      padding: 4px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .quantity-button {
      min-width: 46px;
      min-height: 44px;
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 900;
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .quantity-button[aria-pressed="true"] {
      color: #06111e;
      background: var(--gold);
    }

    .trade-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .trade-button {
      min-height: 50px;
      padding: 8px;
      font-size: 13px;
      font-weight: 900;
      border-radius: 13px;
      cursor: pointer;
    }

    .trade-button.buy {
      color: #051710;
      background: var(--buy);
      border: 1px solid rgba(255, 255, 255, 0.32);
    }

    .trade-button.sell {
      color: #230808;
      background: var(--sell);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .trade-button:disabled {
      color: var(--muted);
      background: rgba(255, 255, 255, 0.055);
      border-color: var(--border);
    }

    .market-closed {
      display: flex;
      min-height: 50px;
      gap: 9px;
      justify-content: center;
      align-items: center;
      color: #ffd3d3;
      font-size: 13px;
      font-weight: 900;
      background: rgba(255, 118, 118, 0.08);
      border: 1px solid rgba(255, 118, 118, 0.22);
      border-radius: 13px;
    }

    .order-log {

      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;

      .content {

      }

      .not-equal,

      }

        grid-template-columns: 1fr;
      }

        height: 230px;

    }

    @media (prefers-reduced-motion: reduce) {

      *::after {

        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

          },
          ai: {
            name: "賢者オラクルのAI分析",
            short: "AI",
            description: "追加資料を含む再分析",
            result: "追加資料を含めると事故の可能性41％。公式の製品一覧はまだ解析対象外。"
          }
        }
      };

      const app = document.getElementById("app");
      const liveRegion = document.getElementById("live-region");
      let animationGeneration = 0;
      let toastTimer = null;

      function initialPrices() {
        return Object.fromEntries(GUILDS.map((guild) => [guild.id, guild.initialPrice]));
      }

      function initialHoldings() {
        return Object.fromEntries(GUILDS.map((guild) => [guild.id, { quantity: 0, costBasis: 0 }]));
      }

      function createInitialState() {
        const prices = initialPrices();
        return {
          version: VERSION,
          stageIndex: 0,
          cash: INITIAL_CASH,
          prices,
          holdings: initialHoldings(),
          selectedGuild: null,
          selectedQuantity: 5,
          tradesByStage: {},
          ticket: {
            available: true,
            status: "available",
            usedAt: null,
            source: null,
            result: null
          },
          investigationWindows: {
            window1: null,
            window2: null
          },
          investigationHistory: [],
          activeInfoTab: "scout",
          viewedInfo: {
            scout: false,
            analyst: false
          },
          completedAnimations: {},
          stageMarkers: {},
          events: [],
          priceHistory: [{
            label: "開始",
            kind: "start",
            stageId: "WELCOME",
            prices: { ...prices }
          }],
          snapshots: {},
          lastMoveGuild: null,
          liveMessage: "王国市場は開場前です",
          animating: false,
          settled: false,
          settlement: null,
          toast: null
        };
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return createInitialState();
          const parsed = JSON.parse(stored);
          if (parsed.version !== VERSION || !Number.isInteger(parsed.stageIndex)) {
            return createInitialState();
          }
          if (parsed.stageIndex < 0 || parsed.stageIndex >= STAGES.length) {
            return createInitialState();
          }
          // An animation cannot survive a page reload. Clear the transient lock so
          // the current scene can be replayed instead of leaving the demo stuck.
          parsed.animating = false;
          return parsed;
        } catch (error) {
          return createInitialState();
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          // The demo remains usable in memory when file:// storage is unavailable.
        }
      }

      function stage() {
        return STAGES[state.stageIndex];
      }

      function guildById(id) {
        return GUILDS.find((guild) => guild.id === id);
      }

      function isMarketOpen() {
        return MARKET_STAGES.has(stage().id) && !state.animating && !state.settled;
      }

      function formatGold(value) {
        return `${Math.round(value).toLocaleString("ja-JP")}G`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function displayPrices() {
        const entries = GUILDS.map((guild) => {
          const price = state.prices[guild.id];
          return {
            id: guild.id,
            floor: Math.floor(price),
            fraction: price - Math.floor(price)
          };
        });
        let remaining = 100 - entries.reduce((sum, entry) => sum + entry.floor, 0);
        entries
          .slice()
          .sort((a, b) => b.fraction - a.fraction)
          .forEach((entry) => {
            if (remaining > 0) {
              entry.floor += 1;
              remaining -= 1;
            }
          });
        return Object.fromEntries(entries.map((entry) => [entry.id, entry.floor]));
      }

      function portfolioValue() {
        if (state.settled && state.settlement) return state.settlement.total;
        return state.cash + GUILDS.reduce((total, guild) => {
          return total + state.holdings[guild.id].quantity * state.prices[guild.id];
        }, 0);
      }

      function quote(guildId, quantity) {
        return displayPrices()[guildId] * quantity;
      }

      function recordPricePoint(label, kind, extra = {}) {
        state.priceHistory.push({
          label,
          kind,
          stageId: stage().id,
          prices: { ...state.prices },
          ...extra
        });
      }

      function recordMarker(stageId, label, kind) {
        if (state.stageMarkers[stageId]) return;
        state.stageMarkers[stageId] = true;
        recordPricePoint(label, kind);
      }

      function calculateForecastSnapshot() {
        const allocations = Object.fromEntries(GUILDS.map((guild) => [guild.id, state.holdings[guild.id].costBasis]));
        const totalCostBasis = Object.values(allocations).reduce((sum, value) => sum + value, 0);
        if (totalCostBasis <= 0.001) {
          return {
            favoriteId: null,
            favoriteLabel: "未投資",
            allocationRate: 0,
            allocations,
            cash: state.cash
          };
        }
        const maximum = Math.max(...Object.values(allocations));
        const leaders = GUILDS.filter((guild) => Math.abs(allocations[guild.id] - maximum) < 0.01);
        const favoriteId = leaders.length === 1 ? leaders[0].id : "tie";
        const favoriteLabel = leaders.length === 1 ? leaders[0].name : "分散・同率";
        const denominator = state.cash + totalCostBasis;
        return {
          favoriteId,
          favoriteLabel,
          allocationRate: denominator > 0 ? maximum / denominator : 0,
          allocations,
          cash: state.cash
        };
      }

      function captureSnapshot(name) {
        state.snapshots[name] = calculateForecastSnapshot();
      }

      function movePrice(guildId, side, quantity) {
        const direction = side === "buy" ? 1 : -1;
        const oldTarget = state.prices[guildId];
        const desired = oldTarget + direction * quantity * PRICE_IMPACT;
        const newTarget = Math.max(PRICE_MIN, Math.min(PRICE_MAX, desired));
        const appliedDelta = newTarget - oldTarget;
        const otherGuilds = GUILDS.filter((guild) => guild.id !== guildId);
        const otherTotal = otherGuilds.reduce((sum, guild) => sum + state.prices[guild.id], 0);

        state.prices[guildId] = newTarget;
        otherGuilds.forEach((guild) => {
          const share = otherTotal > 0 ? state.prices[guild.id] / otherTotal : 1 / otherGuilds.length;
          state.prices[guild.id] -= appliedDelta * share;
        });

        const clamped = GUILDS.map((guild) => Math.max(PRICE_MIN, Math.min(PRICE_MAX, state.prices[guild.id])));
        const total = clamped.reduce((sum, value) => sum + value, 0);
        GUILDS.forEach((guild, index) => {
          state.prices[guild.id] = clamped[index] * (100 / total);
        });
        state.lastMoveGuild = guildId;
      }

      function applyOrder(order, actorType) {
        const { actor, guildId, side, quantity } = order;
        const guild = guildById(guildId);
        const total = actorType === "player"
          ? quote(guildId, quantity)
          : Math.round(state.prices[guildId] * quantity);

        if (actorType === "player") {
          const holding = state.holdings[guildId];
          if (!isMarketOpen()) {
            showToast("市場が停止中のため、注文できません");
            return false;
          }
          if (side === "buy" && state.cash < total) {
            showToast("ゴールドが足りません");
            return false;
          }
          if (side === "sell" && holding.quantity < quantity) {
            showToast("保有口数が足りません");
            return false;
          }

          if (side === "buy") {
            state.cash -= total;
            holding.quantity += quantity;
            holding.costBasis += total;
          } else {
            const averageCost = holding.quantity > 0 ? holding.costBasis / holding.quantity : 0;
            state.cash += total;
            holding.quantity -= quantity;
            holding.costBasis = Math.max(0, holding.costBasis - averageCost * quantity);
            if (holding.quantity === 0) holding.costBasis = 0;
          }
          state.tradesByStage[stage().id] = (state.tradesByStage[stage().id] || 0) + 1;
        }

        const before = state.prices[guildId];
        movePrice(guildId, side, quantity);
        const after = state.prices[guildId];
        const event = {
          type: "trade",
          actorType,
          actor,
          guildId,
          side,
          quantity,
          total,
          before,
          after,
          stageId: stage().id
        };
        state.events.push(event);
        recordPricePoint(
          `${actorType === "npc" ? actor : "あなた"} ${side === "buy" ? "買" : "売"}${quantity}口`,
          actorType === "npc" ? "npc" : "player",
          { guildId, side, quantity, actorType }
        );
        state.liveMessage = `${actor}が${guild.name}を${quantity}口${side === "buy" ? "買いました" : "売りました"}`;
        saveState();
        return true;
      }

      function showToast(message) {
        state.toast = message;
        liveRegion.textContent = message;
        render();
        if (toastTimer) window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          state.toast = null;
          render();
        }, 2400);
      }

      function validateAdvance() {
        const current = stage().id;
        if (state.animating) return "市場の動きが終わるまでお待ちください";
        if (current === "INITIAL_MARKET" && !(state.tradesByStage.INITIAL_MARKET > 0)) {
          return "ギルドを選び、成功証を1回以上買ってください";
        }
        if (current === "DUAL_INFO" && !(state.viewedInfo.scout && state.viewedInfo.analyst)) {
          return "スカウト面とアナリスト面の両方を確認してください";
        }
        if (["POPULARITY_MOVE", "RUMOR_CRASH", "AI_PUBLIC_REPORT", "OFFICIAL_EVIDENCE"].includes(current) && !state.completedAnimations[current]) {
          return "王国市場の動きを確認してください";
        }
        if (current === "INVESTIGATION_WINDOW_1" && !state.investigationWindows.window1) {
          return "調査するか、調査券を温存するか選んでください";
        }
        if (current === "INVESTIGATION_WINDOW_2" && state.ticket.available && !state.investigationWindows.window2) {
          return "調査券を使うか、今回は見送るか選んでください";
        }
        if (current === "FINAL_MARKET" && !(state.tradesByStage.FINAL_MARKET > 0)) {
          return "最後に1回以上、買うか売るかを選んでください";
        }
        return null;
      }

      function settle() {
        if (state.settled) return;
        const winnerQuantity = state.holdings.dragon.quantity;
        const payout = winnerQuantity * 100;
        state.settlement = {
          winnerId: "dragon",
          winnerQuantity,
          payout,
          cash: state.cash,
          total: state.cash + payout
        };
        state.settled = true;
        state.events.push({ type: "settlement", stageId: "SETTLEMENT", total: state.settlement.total });
        saveState();
      }

      function onEnterStage() {
        const current = stage().id;
        const markers = {
          POPULARITY_NEWS: ["人気ニュース", "news"],
          DUAL_INFO: ["2つの情報", "info"],
          RUMOR_CRASH: ["事故の噂", "rumor"],
          AI_PUBLIC_REPORT: ["AIレポート", "ai"],
          OFFICIAL_EVIDENCE: ["公式資料", "official"]
        };
        if (markers[current]) recordMarker(current, markers[current][0], markers[current][1]);
        if (current === "DUAL_INFO" && !state.viewedInfo.scout) {
          state.viewedInfo.scout = true;
          state.activeInfoTab = "scout";
        }
        if (current === "SETTLEMENT") settle();
        saveState();
      }

      function advanceStage() {
        const issue = validateAdvance();
        if (issue) {
          showToast(issue);
          return;
        }
        const current = stage().id;
        if (current === "INITIAL_MARKET") captureSnapshot("initial");
        if (current === "FINAL_MARKET") captureSnapshot("final");
        if (state.stageIndex >= STAGES.length - 1) return;
        state.stageIndex += 1;
        state.selectedGuild = null;
        state.lastMoveGuild = null;
        state.liveMessage = `${stage().chapter}「${stage().label}」へ進みました`;
        onEnterStage();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function resetDemo() {
        if (state.stageIndex > 0 && !window.confirm("最初からやり直しますか？ 現在の売買は消去されます。")) return;
        animationGeneration += 1;
        state = createInitialState();
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (error) {
          // Ignore unavailable local storage.
        }
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      function delay(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      async function runNpcSequence() {
        const current = stage().id;
        if (state.animating || state.completedAnimations[current] || !NPC_ORDERS[current]) return;
        const generation = ++animationGeneration;
        state.animating = true;
        state.liveMessage = "王国のほかの商会が動いています…";
        render();
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        for (const order of NPC_ORDERS[current]) {
          if (generation !== animationGeneration) return;
          applyOrder(order, "npc");
          render();
          await delay(reducedMotion ? 30 : 300);
        }

        if (generation !== animationGeneration) return;
        state.completedAnimations[current] = true;
        state.animating = false;
        state.liveMessage = "王国市場の動きが落ち着きました";
        saveState();
        render();
      }

      function chooseInvestigation(sourceId) {
        if (!state.ticket.available) return;
        const windowId = stage().id === "INVESTIGATION_WINDOW_1" ? "window1" : "window2";
        const source = INVESTIGATIONS[windowId][sourceId];
        if (!source) return;
        state.ticket = {
          available: false,
          status: "used",
          usedAt: windowId,
          source: sourceId,
          result: source.result
        };
        state.investigationWindows[windowId] = "used";
        const investigation = {
          type: "investigation",
          windowId,
          sourceId,
          sourceName: source.name,
          result: source.result,
          stageId: stage().id
        };
        state.investigationHistory.push(investigation);
        state.events.push(investigation);
        recordPricePoint(`調査：${source.name}`, "investigation", { sourceId });
        state.liveMessage = `${source.name}の調査結果を入手しました`;
        saveState();
        render();
      }

      function saveTicketForLater() {
        if (stage().id !== "INVESTIGATION_WINDOW_1" || !state.ticket.available) return;
        state.investigationWindows.window1 = "saved";
        state.liveMessage = "調査券を第4幕まで温存します";
        state.events.push({ type: "ticket_saved", stageId: stage().id });
        saveState();
        render();
      }

      function expireTicket() {
        if (stage().id !== "INVESTIGATION_WINDOW_2" || !state.ticket.available) return;
        state.investigationWindows.window2 = "skipped";
        state.ticket.available = false;
        state.ticket.status = "expired";
        state.liveMessage = "調査券は使わず、公開情報で判断します";
        state.events.push({ type: "ticket_expired", stageId: stage().id });
        saveState();
        render();
      }

      function trade(side) {
        if (!state.selectedGuild) {
          showToast("取引するギルドを選んでください");
          return;
        }
        const success = applyOrder({
          actor: "あなたの商会",
          guildId: state.selectedGuild,
          side,
          quantity: state.selectedQuantity
        }, "player");
        if (success) {
          const guild = guildById(state.selectedGuild);
          showToast(`${guild.name}を${state.selectedQuantity}口${side === "buy" ? "買いました" : "売りました"}`);
        }
      }

      function renderHeader() {
        const current = stage();
        const progress = state.stageIndex === 0 ? 0 : Math.round((state.stageIndex / (STAGES.length - 1)) * 100);
        const ticketText = state.ticket.available ? "調査券 1枚" : state.ticket.status === "used" ? "調査済み" : "調査券なし";
        return `
          <header class="topbar">
            <div class="topbar-inner">
              <div class="brand" aria-label="F-Sports GUILD MARKET">
                <div class="brand-mark" aria-hidden="true">GM</div>
                <div class="brand-copy">
                  <span class="brand-kicker">F-SPORTS #01</span>
                  <span class="brand-title">GUILD MARKET</span>
                </div>
              </div>
              <div class="top-actions">
                <span class="demo-badge">OFFLINE DEMO</span>
                <span class="market-badge" data-open="${isMarketOpen()}">
                  <span class="status-dot" aria-hidden="true"></span>
                  ${isMarketOpen() ? "市場オープン" : "市場ストップ"}
                </span>
                <button class="ghost-button" type="button" data-action="reset">最初から</button>
              </div>
            </div>
            <div class="progress-wrap">
              <div class="progress-meta">
                <span>${escapeHtml(current.chapter)} · ${escapeHtml(current.label)}</span>
                <span>STEP ${state.stageIndex} / ${STAGES.length - 1}</span>
              </div>
              <div class="progress-track" aria-label="デモ進行 ${progress}%">
                <div class="progress-value" style="width:${progress}%"></div>
              </div>
            </div>
          </header>
          <div class="asset-strip" aria-label="商会の資産状況">
            <div class="asset-card">
              <span class="asset-label">手元のゴールド</span>
              <strong class="asset-value">${formatGold(state.cash)}</strong>
            </div>
            <div class="asset-card">
              <span class="asset-label">現在の総資産</span>
              <strong class="asset-value">${formatGold(portfolioValue())}</strong>
            </div>
            <div class="asset-card">
              <span class="asset-label">調査</span>
              <strong class="asset-value" style="font-size:clamp(14px,2.4vw,20px)">${ticketText}</strong>
            </div>
          </div>
        `;
      }

      function renderHero() {
        return `
          <main id="main" class="hero">
            <section class="hero-card">
              <div class="hero-mark" aria-hidden="true">GM</div>
              <p class="hero-kicker">F-SPORTS #01</p>
              <h1 class="hero-title">GUILD MARKET</h1>
              <p class="hero-subtitle">王国一のギルドを見抜け</p>
              <p class="hero-copy">あなたは王国の「予測商会」。ニュースを読み、4つのギルドの未来を予測し、成功証を売買します。</p>
              <p class="hero-principle">情報を読む → 売買する → 結果を見て修正する</p>
              <div>
                <button class="primary-button" type="button" data-action="next">デモを始める</button>
              </div>
              <p class="requirement">約7分30秒 · オフライン提案用デモ · ゲーム内ポイントのみ</p>
            </section>
          </main>
        `;
      }

      function guildSealSvg(guildId) {
        const marks = {
          airship: `
            <ellipse cx="32" cy="22" rx="19" ry="12"></ellipse>
            <path d="M13 22h38M21 12c-3 7-3 13 0 20M43 12c3 7 3 13 0 20"></path>
            <path d="M24 34l3 9h10l3-9M24 46h16"></path>
          `,
          alchemy: `
            <path d="M24 10h16M27 10v15L17 44c-3 6 1 10 7 10h16c6 0 10-4 7-10L37 25V10"></path>
            <path d="M21 41h22M27 34h10"></path>
          `,
          dragon: `
            <path d="M14 47c3-17 12-28 29-32l-5 10 12 4-10 6 7 10-13-4c-4 7-10 11-20 11"></path>

      function renderGuildBriefs() {
        const prices = displayPrices();
        return `
          <div class="guild-briefs">
            ${GUILDS.map((guild) => `
              <div class="guild-brief" style="--guild-color:${guild.color}">

                <span class="brief-price">${prices[guild.id]}G</span>
              </div>
            `).join("")}
          </div>
        `;

      function renderAiReport() {
        return `
          <div class="report-card">
            <span class="report-label">賢者オラクル · AI速報レポート</span>
            <div class="report-row">
              <span>事故の可能性</span>
              <strong class="report-probability">76%</strong>
            </div>
            <div class="report-row">
              <span>根拠</span>
              <strong>SNS投稿213件・目撃情報12件</strong>
            </div>
            <div class="report-row">
              <span>未確認</span>
              <strong>製品番号・公式事故報告</strong>
            </div>
          </div>
        `;
      }

      function renderInvestigation(windowId) {
        const resolved = state.investigationWindows[windowId];
        if (state.ticket.status === "used") {
          const usedSource = INVESTIGATIONS[state.ticket.usedAt][state.ticket.source];
          return `
            <div class="clue-card">
              <strong>調査済み · ${escapeHtml(usedSource.name)}</strong>
              <p>${escapeHtml(state.ticket.result)}</p>
            </div>
            <button class="primary-button" type="button" data-action="next">市場へ進む</button>
          `;
        }
        if (state.ticket.status === "expired") {
          return `
            <div class="stage-note">調査券は使わず、全員に公開された情報だけで判断します。これも一つの選択です。</div>
            <button class="primary-button" type="button" data-action="next">市場へ進む</button>
          `;
        }
        if (windowId === "window1" && resolved === "saved") {
          return `
            <div class="stage-note">調査券を第4幕まで温存しました。いま見えている価格と情報だけで、暴落後の市場へ進みます。</div>
            <button class="primary-button" type="button" data-action="next">暴落後の市場へ</button>
          `;
        }

        const sources = INVESTIGATIONS[windowId];
        return `
          <div class="investigation-grid" aria-label="調査先を選ぶ">
            ${Object.entries(sources).map(([sourceId, source]) => `
              <button class="source-button" type="button" data-action="investigate" data-source="${sourceId}">
                <span class="source-icon" aria-hidden="true">${source.short}</span>
                <span>
                  <strong>${source.name}</strong>
                  <small>${source.description}</small>
                </span>
                <span class="source-arrow" aria-hidden="true">›</span>
              </button>

        const current = stage().id;
        if (current === "WELCOME") {
          app.innerHTML = `<div class="app-shell">${renderHero()}</div>${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}`;
        } else if (current === "SETTLEMENT") {
          app.innerHTML = `<div class="app-shell">${renderHeader()}${renderSettlement()}</div>${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}`;
        } else if (current === "REPLAY") {
          app.innerHTML = `<div class="app-shell">${renderHeader()}${renderReplay()}</div>${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}`;
        } else {
          app.innerHTML = `<div class="app-shell">${renderGame()}</div>${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}`;
        }
        window.requestAnimationFrame(() => {
          const marketCanvas = document.getElementById("market-chart");
          const replayCanvas = document.getElementById("replay-chart");
          if (marketCanvas) drawChart(marketCanvas, false);
          if (replayCanvas) drawChart(replayCanvas, true);
        });
      }

      function drawChart(canvas, replay) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        const context = canvas.getContext("2d");
        context.scale(ratio, ratio);

        const width = rect.width;
        const height = rect.height;
        const left = replay ? 34 : 27;
        const right = 8;
        const top = 9;
        const bottom = replay ? 24 : 18;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const points = replay ? state.priceHistory : state.priceHistory.slice(-24);
        const data = points.length > 1 ? points : [points[0], points[0]];

        context.clearRect(0, 0, width, height);
        context.font = "9px -apple-system, BlinkMacSystemFont, sans-serif";
        context.textAlign = "right";
        context.textBaseline = "middle";
        [0, 25, 50, 75, 100].forEach((value) => {
          const y = top + plotHeight - (value / 100) * plotHeight;
          context.beginPath();
          context.strokeStyle = "rgba(200, 218, 235, 0.09)";
          context.lineWidth = 1;
          context.moveTo(left, y);
          context.lineTo(width - right, y);
          context.stroke();
          if (value === 0 || value === 50 || value === 100) {
            context.fillStyle = "rgba(200, 218, 235, 0.48)";
            context.fillText(String(value), left - 5, y);
          }
        });

        if (replay) {
          data.forEach((point, index) => {
            if (!["news", "rumor", "ai", "official", "investigation"].includes(point.kind)) return;
            const x = left + (index / Math.max(1, data.length - 1)) * plotWidth;
            const colorByKind = {
              news: "rgba(255, 177, 92, 0.38)",
              rumor: "rgba(255, 118, 118, 0.48)",
              ai: "rgba(104, 182, 255, 0.42)",
              official: "rgba(112, 212, 154, 0.45)",
              investigation: "rgba(243, 201, 105, 0.35)"
            };
            context.beginPath();
            context.strokeStyle = colorByKind[point.kind];
            context.setLineDash([3, 4]);
            context.moveTo(x, top);
            context.lineTo(x, top + plotHeight);
            context.stroke();
            context.setLineDash([]);
          });
        }

        GUILDS.forEach((guild) => {
          context.beginPath();
          context.strokeStyle = guild.color;
          context.lineWidth = replay ? 2.5 : 2;
          context.lineJoin = "round";
          context.lineCap = "round";
          data.forEach((point, index) => {
            const x = left + (index / Math.max(1, data.length - 1)) * plotWidth;
            const value = point.prices[guild.id];
            const y = top + plotHeight - (value / 100) * plotHeight;
            if (index === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          });
          context.stroke();
        });

        context.textAlign = "left";
        context.textBaseline = "top";
        context.fillStyle = "rgba(200, 218, 235, 0.48)";
        context.fillText("開始", left, height - bottom + 6);
        context.textAlign = "right";
        context.fillText("現在", width - right, height - bottom + 6);
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button || button.disabled) return;
        const action = button.dataset.action;
        if (action === "next") advanceStage();
        if (action === "reset") resetDemo();
        if (action === "run-npc") runNpcSequence();
        if (action === "select-guild") {
          state.selectedGuild = button.dataset.guild;
          saveState();
          render();
        }
        if (action === "quantity") {
          state.selectedQuantity = Number(button.dataset.quantity);
          saveState();
          render();
        }
        if (action === "trade") trade(button.dataset.side);
        if (action === "info-tab") {
          state.activeInfoTab = button.dataset.tab;
          state.viewedInfo[button.dataset.tab] = true;
          saveState();
          render();
        }
        if (action === "investigate") chooseInvestigation(button.dataset.source);
        if (action === "save-ticket") saveTicketForLater();
        if (action === "expire-ticket") expireTicket();
      });

      window.addEventListener("resize", () => {
        const marketCanvas = document.getElementById("market-chart");
        const replayCanvas = document.getElementById("replay-chart");
        if (marketCanvas) drawChart(marketCanvas, false);
        if (replayCanvas) drawChart(replayCanvas, true);
      });

      onEnterStage();
      render();
    })();
  </script>
</body>
</html>
